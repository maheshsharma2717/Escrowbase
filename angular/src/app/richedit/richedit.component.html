<div class="richedit-shell">
  <div #quillEditorContainer class="richedit-container"></div>
  <div *ngIf="errorMessage" class="docx-preview-error">{{ errorMessage }}</div>
  <div *ngIf="!isSupported && !errorMessage && isHtmlFallback" class="docx-fallback-html" [innerHTML]="fallbackHtml"></div>
  <div *ngIf="!isSupported && !errorMessage && !isHtmlFallback" class="docx-fallback-text">{{ fallbackText }}</div>
</div>
